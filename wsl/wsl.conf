# wsl.conf — Dotfiles Citadel (backup copy)
# Managed by: https://github.com/geekedsilicon/dotfiles
#
# LIVE LOCATION: /etc/wsl.conf  (inside the WSL2 Ubuntu instance, as root)
# This file is tracked as a reference backup — it cannot be symlinked because
# /etc/ requires root ownership.  To apply changes:
#   sudo cp /mnt/c/Users/samue/workspace/dotfiles/wsl/wsl.conf /etc/wsl.conf
#   wsl --shutdown   (from Windows)
#
# Reference: https://learn.microsoft.com/en-us/windows/wsl/wsl-config#wslconf

[automount]
# Mount Windows drives under /mnt/ (default is /mnt/c etc.)
root    = /mnt/
options = "metadata,umask=22,fmask=11"
# Automatically mount all fixed drives.
enabled = true

[boot]
# Enable systemd inside WSL2 (required for Docker, snapd, etc.)
systemd = true

[interop]
# Allow launching Windows executables from WSL.
enabled        = true
appendWindowsPath = true

[network]
# Use a predictable hostname.
hostname       = citadel-wsl
generateResolvConf = true

[user]
# Default Linux user for new WSL sessions.
default = samue
