# starship.toml — Dotfiles Citadel
# Managed by: https://github.com/geekedsilicon/dotfiles
# Symlinked to: ~/.config/starship.toml
#
# Minimal, fast prompt tuned for WSL2 + PowerShell dual-shell usage.
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration$line_break$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
truncation_length    = 4
truncate_to_repo     = true
style                = "bold cyan"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style  = "bold yellow"

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "

[python]
symbol = " "
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time           = 2000
format             = "[ $duration]($style) "
style              = "yellow"
show_notifications = false

[username]
show_always = false

[hostname]
ssh_only = true
